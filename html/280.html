<title>Hotline Miami 2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#ccc;font:15px system-ui}
canvas{position:fixed;inset:0;margin:auto;max-width:100%;max-height:100%;aspect-ratio:16/9;image-rendering:pixelated;outline:0}
#loading{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;background:#000}
#loading h1{margin:0;color:#ec327f;letter-spacing:.04em}
[hidden]{display:none!important}
progress{width:min(420px,80vw);accent-color:#ec327f}
</style>
<canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
<div id="loading"><h1>HOTLINE MIAMI 2</h1><p id="status">Loading...</p><progress id="progress"></progress></div>
<script src="https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c0957/games/hlm2/app.js"></script>
<script>
const canvas=document.getElementById('canvas'),loading=document.getElementById('loading'),status=document.getElementById('status'),progress=document.getElementById('progress');
const show=text=>{status.textContent=text;loading.hidden=false;};
canvas.oncontextmenu=e=>e.preventDefault();
canvas.onclick=()=>canvas.focus();
canvas.ondblclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
let loaded=0;
async function gather(manifest,name){
 const entry=manifest[name],out=new Uint8Array(entry.size);
 let at=0;
 for(const part of entry.parts){
  const chunk=new Uint8Array(await(await fetch(part)).arrayBuffer());
  out.set(chunk,at);
  at+=chunk.length;
  loaded+=chunk.length;
  progress.value=loaded;
  status.textContent='Loading '+(loaded/1048576).toFixed(0)+' / '+(progress.max/1048576).toFixed(0)+' MB';
 }
 return out.buffer;
}
async function start(){
 if(!WebAssembly.Suspending)return show('This browser needs WebAssembly JSPI (Chrome or Edge 137+).');
 const manifest=await(await fetch('parts.json')).json();
 progress.max=manifest['app.data'].size+manifest['app.wasm'].size;
 const wasmBinary=await gather(manifest,'app.wasm');
 const packageData=await gather(manifest,'app.data');
 const app=await createPEModule({canvas,print:console.log,printErr:console.warn,wasmBinary,getPreloadedPackage:()=>packageData,
  setStatus:text=>{if(text)status.textContent=text;},
  preRun:[m=>{m.ENV.PEWASM_DESKTOP='1280x720';}],onAbort:reason=>show('Stopped: '+reason)});
 window.game=app;
 status.textContent='Loading saves...';
 const FS=app.FS;
 for(const dir of ['/documents','/appdata','/localappdata']){try{FS.mkdir(dir);}catch{}FS.mount(FS.filesystems.IDBFS,{},dir);}
 await new Promise(done=>FS.syncfs(true,done));
 const save=()=>FS.syncfs(false,()=>{});
 setInterval(save,3000);
 addEventListener('pagehide',save);
 const wait=setInterval(()=>{if(app.peMesaPresents>0){loading.hidden=true;clearInterval(wait);}},200);
 canvas.focus();
 try{await app.ccall('pe_run','number',[],[],{async:true});}catch{}
 save();
 show('Thanks for playing. Reload to play again.');
}
start().catch(e=>show('Error: '+e.message));
</script></html>
