	<style>
	body {
		background-color: #55B9A7;
	}
	
	.bg-image {
		height: 100%;
		width: 100%;
		left: 0px;
		top: 0px;
		right: 0px;
		bottom: 0px;
		position: fixed;
		background-size: cover;
		background-repeat: no-repeat;
		background-attachment: fixed;
		background-position: center center;
	}
	
	.background-banner {
		user-select: none;
		position: fixed;
		right: 0%;
		bottom: 0%;
		transform: translate(-8px, -8px);
	}
	
	.definitive-banner {
		user-select: none;
		position: fixed;
		left: 0%;
		bottom: 0%;
		transform: translate(+8px, -8px);
	}
	
	.select-panel {
		user-select: none;
		display: block;
		position: fixed;
		left: 50%;
		top: 50%;
		transform: translate(-50%, -50%);
	}
	
	.select-panel .banner {
		user-select: none;
		position: fixed;
		display: block;
		top: 20px;
		left: 55px;
	}
	
	.select-panel .overlay {
		user-select: none;
		position: fixed;
		display: block;
		top: 195px;
		left: 0px;
	}
	
	.select-panel .textbox {
		user-select: none;
		position: fixed;
		display: block;
		top: 104px;
		width: 540px;
		font: 14pt "Arial";
		text-align: center;
		color: rgb(0, 0, 0);
	}
	
	.intext {
		user-select: none;
		position: absolute;
		top: 10px;
		width: 238px;
		font: 18px "Ubuntu";
		text-align: center;
		font-weight: bold;
		-webkit-text-stroke: #000;
		-webkit-text-stroke-width: medium;
		color: rgb(255, 255, 255);
	}
	
	.button-disabled {
		filter: brightness(0.5);
		user-select: none;
		display: block;
		position: fixed;
	}
	
	.button {
		user-select: none;
		display: block;
		position: fixed;
		cursor: pointer;
	}
	
	.button:hover {
		transform: translate(0px, -3px);
	}
	
	.button:active {
		transform: translate(0px, 0px);
	}
	
	.warning-panel {
		user-select: none;
		display: none;
		position: fixed;
		left: 50%;
		top: 50%;
		transform: translate(-50%, -50%);
	}
	
	.warning-panel .warning-body {
		user-select: none;
		position: fixed;
		display: block;
		top: 125px;
		left: 24px;
		width: 420px;
		font: 16px "Ubuntu", sans-serif;
		font-weight: bold;
		color: rgb(0, 0, 0);
	}
	
	.theme-config {
		user-select: none;
		display: none;
		position: fixed;
		left: 50%;
		top: 50%;
		transform: translate(-50%, -50%);
	}
	
	.slider {
	    -webkit-appearance: none;
		height: 50px;
		width: 200px;
		position: fixed;
		background: url("./images/slider-bar.png");
		cursor: pointer;
	}
	
	.slider::-webkit-slider-thumb {
		-webkit-appearance: none;
		appearance: none;
		width: 50px;
		height: 50px;
		border: 0;
		background: url("./images/slider-thumb.png");
		cursor: pointer;
	}
	</style>

getCookie = function(cname) {
	let name = cname + "=";
	let decodedCookie = decodeURIComponent(document.cookie);
	let ca = decodedCookie.split(';');
	for(let i = 0; i <ca.length; i++) {
		let c = ca[i];
		while (c.charAt(0) == ' ') {
			c = c.substring(1);
		}
		if (c.indexOf(name) == 0) {
			return c.substring(name.length, c.length);
		}
	}
	return "";
},
setCookie = function(cname, cvalue, exdays) {
	const d = new Date();
	d.setTime(d.getTime() + (exdays*24*60*60*1000));
	let expires = "expires="+ d.toUTCString();
	document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";

getSavedBackground = function() {

		if (Backgrounds[i].id == backgroundId) {
			document.getElementById(Backgrounds[i].element).style.display = "block"
		} else {
			document.getElementById(Backgrounds[i].element).style.display = "none"
		}
	}

toggleBackground = function() {

	if (previous == "")
		previous = "1";
	let backid;
	for (let i = 0; i < Backgrounds.length; i++) {
		if(i == previous - 1)
			backid = i + 1
	};
	if (backid >= Backgrounds.length)
		backid = 0;
	backid++;

setBackgroundBrightness = function(value) {
	let backgrounds = document.getElementsByClassName("bg-image");
	for(let it = 0; it < backgrounds.length; it++) {
		backgrounds[it].style.filter = "brightness(" + value + ")"
	}
	setCookie("bgLum", value, 4096);
	let left = document.getElementById("bg-slider-left");
	let right = document.getElementById("bg-slider-right");
	if (parseFloat(value) >= 2) {
		left.setAttribute("class", "button")
		right.setAttribute("class", "button-disabled")
	}
	else if (parseFloat(value) <= 0) {
		left.setAttribute("class", "button-disabled")
		right.setAttribute("class", "button")
	}
	else {
		left.setAttribute("class", "button")
		right.setAttribute("class", "button")
	}

	if (result > 2)

	slider.value = (result).toString();

	resizeMenuElements();
	disableThemeButton();
},
ModSelector = function(version) {
	PlayClick();
	if (currentModPage == ModPages.select[selectedModPage]) {
		document.getElementById(currentModPage.id).style.display = "none",
		currentModPage = ModPages.mod[version],
		currentModVersion = version,
		document.getElementById(currentModPage.id).style.display = "block",
		document.getElementById("mod-back").setAttribute("onclick", "ModSelector()"),
		document.getElementById("select-mod-version").style.display = "none",
		document.getElementById("select-mod-play").style.display = "block",
		//document.getElementById("mod-select-apply").style.display = "block",
		document.getElementById("mod-select-apply").className = "button-disabled",
		document.getElementById("mod-previous").className = "button-disabled",
		document.getElementById("mod-next").className = "button-disabled",
		DeselectAllMods(version)
	} else {
		DeselectAllMods(currentModVersion),
		document.getElementById(currentModPage.id).style.display = "none",
		currentModPage = ModPages.select[selectedModPage],
		currentModVersion = null,
		document.getElementById(currentModPage.id).style.display = "block",
		document.getElementById("mod-back").setAttribute("onclick", "closeBetaPopup()"),
		document.getElementById("select-mod-version").style.display = "block",
		document.getElementById("select-mod-play").style.display = "none",
		//document.getElementById("mod-select-apply").style.display = "none",
		document.getElementById("mod-select-apply").className = "button-disabled",
		document.getElementById("mod-previous").className = ModPages.select.length > 1 ? "button" : "button-disabled",
		document.getElementById("mod-next").className =  ModPages.select.length > 1 ? "button" : "button-disabled"
	};
	resizeMenuElements();
},
AddMod = function(modid, version) {
	PlayClick();
	if (selectedMods.indexOf(modid) == -1) {
		document.getElementById("mod-" + modid + "-" + version).setAttribute('src', './images/ModSelectButton-HIGHLIGHT.png'),
		selectedMods.push(modid)
	} else {
		document.getElementById("mod-" + modid + "-" + version).setAttribute('src', './images/ModSelectButton.png'),
		selectedMods.splice(selectedMods.indexOf(modid), 1)
	};
	if (selectedMods.length < 1) {
		document.getElementById("mod-select-apply").className = "button-disabled"
	} else {
		document.getElementById("mod-select-apply").className = "button"
	}
},
DeselectAllMods = function(version) {
	for(let i = 0; i < selectedMods.length; i += 1) {
		try {
			document.getElementById("mod-" + selectedMods[i] + "-" + version).setAttribute('src', './images/ModSelectButton.png')
		} catch(error) {}
	};
	selectedMods = []
},
StartGameMod = function(version) {
	if (selectedMods.length < 1 || version == null) {
		return;
	}
	PlayClick();
	let ModString = '?mods=' + selectedMods.toString();
	setTimeout(()=> {
		window.location.href = "../" + version + "/" + ModString;
	}, 200);
},
generateModPages = function() {
	function logProgress(msg) {
		console.log("[MOD PAGE GENERATOR] " + msg)
	}
	function addVersionPage() {
		let page = document.createElement("div");
		let pageID = "mod-version-select-" + (ModPages.select.length + 1);
		page.draggable = false;
		page.id = pageID;
		ModPages.select.push({
			id: pageID
		});
		document.getElementById("mod-select-overlay").appendChild(page);
		if (ModPages.select.length > 1)
			page.style.display = "none";
		logProgress("New page: " + pageID);
		return page;
	}
	function addModPage(version) {
		let page = document.createElement("div");
		let pageID = "mods-" + version;
		page.draggable = false;
		page.id = pageID;
		ModPages.mod[version] = {
			id: pageID
		};
		logProgress("New modded version: " + version);
		document.getElementById("mod-select-overlay").appendChild(page);
		return page;
	}
	function addVersionButton(ver, curPage, column, columnLength, useCustom) {
		let currentButton = document.createElement("a"),
			panelImage = document.createElement("img"),
			textImage = document.createElement("img"),
			textElement = document.createElement("div");
			
		currentButton.setAttribute("onclick", "ModSelector(\"" + (useCustom ? (ver.button.ver) : (Versions[ver.baseVersion].ver)) + "\")");
		currentButton.setAttribute("class", "button");
		currentButton.setAttribute("draggable", false);
		currentButton.style.position = "absolute";
		currentButton.style.top = (10 + (columnLength * 50)) + "px";
		if (column == 1) {
			currentButton.style.left = "23px"
		} else {
			currentButton.style.right = "23px"
		};
		panelImage.setAttribute("src", "./images/ModSelectButton.png");
		panelImage.setAttribute("draggable", false)
		textImage.setAttribute("src", (useCustom ? (ver.button.src) : (Versions[ver.baseVersion].src)));
		textImage.setAttribute("alt", (useCustom ? (ver.button.alt) : (Versions[ver.baseVersion].alt)));
		textImage.setAttribute("draggable", false);
		textElement.setAttribute("class", "intext");
		textElement.setAttribute("draggable", false);
		textElement.appendChild(textImage);
		currentButton.appendChild(panelImage);
		currentButton.appendChild(textElement);
		curPage.appendChild(currentButton);
	}
	function addModButton(ver, mod, curPage, column, columnLength, useCustom) {
		let currentButton = document.createElement("a"),
			panelImage = document.createElement("img"),
			textImage = document.createElement("img"),
			textElement = document.createElement("div");
			
		currentButton.setAttribute("onclick", "AddMod(\"" + ver.mods[mod].url + "\", \"" + (useCustom ? (ver.button.ver) : (Versions[ver.baseVersion].ver)) + "\")");
		currentButton.setAttribute("class", "button");
		currentButton.setAttribute("draggable", false);
		currentButton.style.position = "absolute";
		currentButton.style.top = (10 + (columnLength * 50)) + "px";
		if (column == 1) {
			currentButton.style.left = "23px"
		} else {
			currentButton.style.right = "23px"
		};
		panelImage.setAttribute("src", "./images/ModSelectButton.png");
		panelImage.setAttribute("draggable", false);
		panelImage.setAttribute("id", "mod-" + ver.mods[mod].url + "-" + (useCustom ? (ver.button.ver) : (Versions[ver.baseVersion].ver)));
		textImage.setAttribute("src", ver.mods[mod].src);
		textImage.setAttribute("alt", ver.mods[mod].alt);
		textImage.setAttribute("draggable", false);
		textElement.setAttribute("class", "intext");
		textElement.setAttribute("draggable", false);
		textElement.appendChild(textImage);
		currentButton.appendChild(panelImage);
		currentButton.appendChild(textElement);
		curPage.appendChild(currentButton);
		logProgress("New " + (useCustom ? (ver.button.ver) : (Versions[ver.baseVersion].ver)) + " mod: " + ver.mods[mod].url);
	}
	logProgress("Start generating...");
	let column = 3;
	let columnLength = 0;
	let curPage = null;
	for (var i = 0; i < ModList.length; i++) {
		let ver = ModList[i];
		if (columnLength > 4) {
			columnLength = 0;
			column++;
			logProgress("New column: " + column);
		};
		if (column > 2) {
			curPage = addVersionPage();
			column = 1;
		};
		let useCustom = !!ver.custom;
		addVersionButton(ver, curPage, column, columnLength, useCustom);
		let verPage = addModPage((useCustom ? (ver.button.ver) : (Versions[ver.baseVersion].ver)));
		let verCol = 1;
		let verColLength = 0;
		verPage.style.display = "none";
		for (var mod = 0; mod < ver.mods.length; mod++) {
			if (verColLength > 4) {
				verColLength = 0;
				verCol++;
				logProgress("New " + (useCustom ? (ver.button.ver) : (Versions[ver.baseVersion].ver)) + " column: " + column);
			};
			addModButton(ver, mod, verPage, verCol, verColLength, useCustom);
			verColLength++;
		}
		columnLength++;
	}
	logProgress("Done!")
},
logGenProgress = function(msg) {
	console.log("[SELECT PAGE GENERATOR] " + msg);
},
generatePages = function() {
	logGenProgress("Start generating...");
	let pageId = 0,
		column = 3,
		columnLength = 0;
	for (let i = 0; i < Versions.length; i++) {
		if (columnLength > 4) {
			columnLength = 0,
			column++
			logGenProgress("New column: " + column);
		};
		if (column > 2) {
			pageId++;
			newPage(pageId);
			column = 1;
			logGenProgress("New page: " + pageId);
		};
		newVersionButton(i, pageId, columnLength, column);
		logGenProgress("New version: " + Versions[i].ver)
		columnLength++
	}
	logGenProgress("Done!");
},
newVersionButton = function(i, pageId, columnLength, column) {
	let pageElement = document.getElementById(Pages[pageId - 1].id),
		currentButton = document.createElement("a"),
		panelImage = document.createElement("img"),
		textImage = document.createElement("img"),
		textElement = document.createElement("div");

	};
	currentButton.setAttribute("class", "button");
	currentButton.setAttribute("draggable", false);
	currentButton.style.position = "absolute";
	currentButton.style.top = (10 + (columnLength * 50)) + "px";
	if (column == 1) {
		currentButton.style.left = "23px"
	} else {
		currentButton.style.right = "23px"
	};
	panelImage.setAttribute("src", "./images/ModSelectButton.png");
	panelImage.setAttribute("draggable", false)
	textImage.setAttribute("src", Versions[i].src);
	textImage.setAttribute("alt", Versions[i].alt);
	textImage.setAttribute("draggable", false);
	textElement.setAttribute("class", "intext");
	textElement.setAttribute("id", "play-version-" + Versions[i].ver);
	textElement.setAttribute("draggable", false);
	textElement.appendChild(textImage);
	currentButton.appendChild(panelImage);
	currentButton.appendChild(textElement);
	pageElement.appendChild(currentButton);
},
newPage = function(id) {
	if (id > Pages.length) {
		Pages[id - 1] = {
			id: "page-" + id
		}
	};
	let page = document.createElement("div");
	page.id = "page-" + id;
	page.draggable = false;
	if (id != 1) {
		page.style.display = "none"
	};
	document.getElementById("select-panel-overlay").appendChild(page);
},
playDefinitiveEdition = function() {
	PlayClick();
	setTimeout(()=> {
		window.location.href = "/";
	}, 200);
},
resizeFromWindow = function(element) {
	let verSelect = element;
	if ((window.innerWidth < verSelect.clientWidth) && ((window.innerWidth / verSelect.clientWidth) < (window.innerHeight / verSelect.clientHeight))) {
		verSelect.style.transform = "scale(" + (window.innerWidth / verSelect.clientWidth) + ") translate(-" + (((verSelect.clientWidth / window.innerWidth) / 2) * 100) + "%" + ", -" + (((verSelect.clientWidth / window.innerWidth) / 2) * 100) + "%" + ")"
	}
	else if (window.innerHeight < verSelect.clientHeight) {
		verSelect.style.transform = "scale(" + (window.innerHeight / verSelect.clientHeight) + ") translate(-" + (((verSelect.clientHeight / window.innerHeight) / 2) * 100) + "%" + ", -" + (((verSelect.clientHeight / window.innerHeight) / 2) * 100) + "%" + ")"
	}
	else {
		verSelect.style.transform = "scale(1) translate(-50%, -50%)"
	}
},
resizeMenuElements = function() {
	resizeFromWindow(document.getElementById("version-select")),
	resizeFromWindow(document.getElementById("mod-select")),
	resizeFromWindow(document.getElementById("beta-popup")),
	resizeFromWindow(document.getElementById("theme-popup"));
},
window.onresize = function() {
	resizeMenuElements()
},
window.onload = function() {
	document.addEventListener("contextmenu", function(e) {
		e.preventDefault();
	}, false);
	resizeMenuElements();
},
