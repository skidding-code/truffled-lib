<title>Wall Kickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ff8f00; --ink: #2b1400; --fg: #fff; --muted: #5a2e00; --accent: #fff; --panel: #2b1400; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font: 16px/1.3 'Lilita One', 'Arial Black', Impact, sans-serif; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; outline: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; background: var(--bg); z-index: 5; text-align: center; padding: 16px; }
  .overlay h1 { margin: 0 0 6px; font-size: clamp(36px, 9vw, 56px); line-height: 1; font-weight: 400;
    color: #fff; letter-spacing: .5px; }
  .bar { width: min(220px, 60vw); height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: #fff; transition: width .15s linear; }
  #status { color: rgba(255,255,255,.8); min-height: 1.3em; max-width: 90vw; white-space: pre-wrap;
    font: 500 13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; letter-spacing: .3px; }
  button.big { font: inherit; font-size: 20px; padding: 10px 26px; border: 0; border-radius: 6px;
    background: #fff; color: #b35f00; cursor: pointer; }
  #dialog { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); z-index: 10; padding: 16px; }
  #dialog .box { background: var(--bg); color: var(--ink); border-radius: 10px; padding: 18px; max-width: 360px; width: 100%; }
  #dialog h2 { margin: 0 0 8px; font-size: 22px; font-weight: 400; }
  #dialog p { margin: 0 0 16px; color: var(--muted); white-space: pre-wrap; }
  #dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #dialog button { font: inherit; padding: 8px 16px; border: 0; border-radius: 6px; cursor: pointer;
    background: #c96a00; color: #fff; }
  #dialog button.primary { background: #fff; color: var(--ink); }
</style>

<script>

function setStatus(text) { statusEl.textContent = text; }
function fail(err) {
  crashed = true; running = false;
  console.error(err);
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('play').hidden = true;
  setStatus('The game stopped: ' + (err && err.message || err));
}

/* ---------------------------------------------------------------- assets zip */
const zip = { bytes: null, entries: new Map() };
function indexZip(bytes) {
  zip.bytes = bytes;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

script.src = 'app.js';
script.onload = () => {
  createPEModule({
    canvas,
    wkJava,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    setStatus: (t) => {
      const m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(t);
      if (m) { const pct = Math.floor(100 * m[1] / m[2]); progressEl.style.width = pct + '%'; setStatus(pct + '%'); }
    },
    monitorRunDependencies: () => {},
    locateFile: (p) => p,
    preRun: [(m) => {
      m.FS.mkdirTree(PKG_FILES);
      m.FS.mount(m.IDBFS, {}, PKG_FILES);
      m.addRunDependency('saves');
      m.FS.syncfs(true, (err) => {
        if (err) console.warn('save load', err);
        try { m.FS.mkdirTree(USERDATA); } catch (e) {}
        try { restoreBackup(m); } catch (e) { console.warn('save restore', e); }
        watchSaves(m);
        m.removeRunDependency('saves');
      });
    }],
    onAbort: (what) => fail(what),
  }).then((m) => {
    M = m;
    window.M = m;
    progressEl.style.width = '100%';
    indexZip(m.FS.readFile('/app/base.apk'));
    start(); /* audio unlocks on the first tap/key (browsers require a gesture) */
  }).catch(fail);
};
script.onerror = () => fail('could not load app.js');
layout();
document.body.appendChild(script);
</script>
</body>
</html>
