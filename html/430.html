            z-index: 11;
            appearance: none;
            border: none;
        }
        #progress::-webkit-progress-bar { background: transparent; }
        #progress::-webkit-progress-value { background: #bdd72e; }

        @keyframes rotation { from {transform:rotate(0)} to {transform:rotate(360deg)} }
        
        .emscripten_border { border: none; }
    </style>
</head>
<body>

    <!-- UI Overlay Layout -->
    <div id="ui-overlay">
        <a href="http://emscripten.org">
            <img id="emscripten_logo" src="assets/p2.png">
        </a>
        <div class="spinner" id="spinner"></div>
        <div id="status">Downloading...</div>
    </div>

    <div id="controls">
        <input onclick='document.getElementById("canvas").requestFullscreen()' type="button" value="Fullscreen">
        <input onclick="update()" type="button" value="Clear Cache" title="Delete cached chunks and reload">
    </div>

    <progress hidden id="progress" max="100" value="0"></progress>

    <div class="emscripten_border">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <script>
        var statusElement = document.getElementById("status"),
            progressElement = document.getElementById("progress"),
            spinnerElement = document.getElementById("spinner"),
            canvasElement = document.getElementById("canvas");

        canvasElement.addEventListener("webglcontextlost", (e => {
            alert("WebGL context lost. You will need to reload the page.");
            e.preventDefault();
        }), !1);

        canvasElement.addEventListener("keydown", (e => {
            if (e.key === "Tab") e.preventDefault();
        }));

        var Module = {
            print(...e) { console.log(...e) },
            printErr(...e) { console.error(...e) },
            canvas: canvasElement,
            setStatus(e) {
                if (Module.setStatus.last ??= { time: Date.now(), text: "" }, e !== Module.setStatus.last.text) {
                    var t = e.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/),
                        n = Date.now();
                    if (!(t && n - Module.setStatus.last.time < 30)) {
                        Module.setStatus.last.time = n;
                        Module.setStatus.last.text = e;
                        if (t) {
                            e = t[1];
                            progressElement.value = 100 * parseInt(t[2]);
                            progressElement.max = 100 * parseInt(t[4]);
                            progressElement.hidden = !1;
                            spinnerElement.hidden = !1;
                        } else {
                            progressElement.value = null;
                            progressElement.max = null;
                            progressElement.hidden = !0;
                            if (!e) {
                                // Hide overlay UI when game is ready
                                spinnerElement.style.display = "none";
                                statusElement.style.display = "none";
                                document.getElementById("emscripten_logo").style.opacity = "0.2";
                            }
                        }
                        statusElement.innerHTML = e;
                    }
                }
            },
            totalDependencies: 0,
            monitorRunDependencies(e) {
                this.totalDependencies = Math.max(this.totalDependencies, e);
                Module.setStatus(e ? "Preparing... (" + (this.totalDependencies - e) + "/" + this.totalDependencies + ")" : "All downloads complete.");
            }
        };

        async function update() {
            try {
                if (window.caches) for (const e of await caches.keys()) await caches.delete(e);
                if (navigator.storage && navigator.storage.getDirectory) {
                    const e = await navigator.storage.getDirectory();
                    await e.removeEntry("portal2_chunks", { recursive: !0 }).catch((() => { }));
                }
                if (navigator.serviceWorker) for (const e of await navigator.serviceWorker.getRegistrations()) await e.unregister();
            } catch (e) { console.warn("cache clear failed", e) }
            location.reload();
        }

        Module.setStatus("Downloading...");
        window.onerror = () => {
            Module.setStatus("Exception thrown, see JavaScript console");
            spinnerElement.style.display = "none";
            Module.setStatus = e => { e && console.error("[post-exception status] " + e) };
        };
    </script>
    <script async src="portal2.js"></script>

</body>
