    }else connect.call(limiter,destination);
    limiters.set(this.context,limiter);
   }
   return connect.call(this,limiter,...ports);
  }
  return connect.call(this,destination,...ports);
 };
}

const objectUrls=[];
async function assetUrl(asset){
 if(typeof asset==='string')return asset;
 const parts=[];
 for(let i=0;i<asset.parts.length;i++){
  const response=await fetch(asset.parts[i]);
  if(!response.ok)throw new Error('Could not load '+asset.parts[i]+' (HTTP '+response.status+')');
  parts.push(await response.blob());
  document.getElementById('status').textContent='Loading '+asset.label+'… '+Math.round((i+1)/asset.parts.length*100)+'%';
 }
 const url=URL.createObjectURL(new Blob(parts,{type:asset.type}));objectUrls.push(url);return url;
}
