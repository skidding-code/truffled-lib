<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=160,initial-scale=1">
<title>Obby Roads</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  a, img { display: block; width: 160px; height: 600px; border: 0; }
</style>
</head>
<body>
  <!-- House ad fallback. Images are relative so this works on any CDN host. -->
  <a id="cta" href="https://obbyroads.io/?utm_source=smashkarts&amp;utm_medium=house&amp;utm_campaign=offcanvas_fallback&amp;utm_content=or161" target="_blank" rel="noopener">
    <img id="creative" src="or161.jpg" width="160" height="600" alt="Play Obby Roads">
  </a>
  <script>
    (function () {
      // Pick one creative at random; without JS the first one above is shown.
      var CREATIVES = ['or161', 'or162'];
      var DEST = 'https://obbyroads.io/';
      var UTM = 'utm_source=smashkarts&utm_medium=house&utm_campaign=offcanvas_fallback';
      var id = CREATIVES[Math.floor(Math.random() * CREATIVES.length)];
      document.getElementById('creative').src = id + '.jpg';
      document.getElementById('cta').href = DEST + '?' + UTM + '&utm_content=' + id;
    })();
  </script>
</body>
</html>
