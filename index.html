<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zones</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#262d36;--text:#e6edf3;--dim:#8b949e;--acc:#7ee0b4;--card:#11161d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 8px 0 0;letter-spacing:.5px}
h1 b{color:var(--acc)}
#q{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font:inherit;outline:none}
#q:focus{border-color:var(--acc)}
select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
#count{color:var(--dim);font-size:12px;white-space:nowrap}
main{max-width:1400px;margin:0 auto;padding:16px}
.sec{margin:6px 0 10px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#1b2129}
.card span{display:block;padding:7px 9px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card i{position:absolute;top:6px;left:6px;font-style:normal;font-size:10px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:5px;color:var(--acc)}
.card .fav{position:absolute;top:4px;right:6px;font-size:16px;color:#fff;opacity:0;text-shadow:0 1px 3px #000}
.card:hover .fav,.card .fav.on{opacity:1}
.card .fav.on{color:#ffd166}
#viewer{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
#viewer.open{display:flex}
#vbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#vname{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vbar button{background:#21262d;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
#vbar button:hover{border-color:var(--acc)}
#vbox{flex:1;position:relative}
#vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#msg{color:var(--dim);padding:40px;text-align:center}
#note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:2}
#note div{max-width:460px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);line-height:1.5}
#note button{margin-top:12px;background:#21262d;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 10px;font:inherit;cursor:pointer}
@media (max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}h1{font-size:16px}}
</style>
</head>
<body>
<header><div class="bar">
<h1>zo<b>nes</b></h1>
<input id="q" type="search" placeholder="search games" autocomplete="off">
<select id="filter"><option value="all">all</option><option value="fav">favorites</option><option value="unity">unity</option><option value="proxy">proxy links</option><option value="threads">needs isolation</option></select>
<select id="sort"><option value="name">a-z</option><option value="id">newest first</option><option value="old">oldest first</option></select>
<span id="count"></span>
</div></header>
<main><div id="msg">loading...</div><div id="recentWrap" hidden><div class="sec">recent</div><div class="grid" id="recent"></div></div><div class="sec" id="allSec" hidden>all</div><div class="grid" id="grid"></div></main>
<div id="viewer"><div id="vbar"><button id="vclose">back</button><span id="vname"></span><button id="vreload">reload</button><button id="vblank">about:blank</button><button id="vdl">download</button><button id="vfull">fullscreen</button></div><div id="vbox"></div></div>
<script>
// everything stays in this function: #embed writes the game into this same window, so launcher globals would collide with the game's
(function () {
// games see this page's url (document.write keeps it); some "fix" a path ending in /index.html by navigating away
try { if (/^https?:$/.test(location.protocol) && /\/index\.html$/.test(location.pathname)) history.replaceState(null, "", location.pathname.slice(0, -10) + location.search + location.hash); } catch (e) {}
var CDN = "https://cdn.jsdelivr.net";
// the library is published twice: the small `lib` tag (served from its own tarball) and `main`.
// jsdelivr sometimes refuses main files with "package size exceeded" because the repo is big, so fall back.
var LIB = CDN + "/gh/skidding-code/truffled-lib@lib";
var LIB2 = CDN + "/gh/skidding-code/truffled-lib@main";
var zonesURL = LIB + "/zones.json";
var coverURL = LIB + "/covers";
var htmlURL = LIB + "/html";
var zones = [], cur = null;
var $ = function (id) { return document.getElementById(id); };
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function zoneURL(u) { return String(u).replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL); }
function baseFor(url, html) {
  var dir = url.slice(0, url.lastIndexOf("/") + 1);
  var m = /<base\b[^>]*\bhref\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i.exec(html);
  if (!m) return dir;
  var v = m[1] !== undefined ? m[1] : m[2] !== undefined ? m[2] : m[3];
  try { return new URL(v, dir).href; } catch (e) { return dir; }
}
function withBase(html, url) {
  var tag = '<base href="' + baseFor(url, html) + '">';
  if (/<base\b[^>]*>/i.test(html)) return html.replace(/<base\b[^>]*>/i, tag);
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, function (m) { return m + tag; });
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, function (m) { return m + tag; });
  return tag + html;
}
function getRetry(u, n) {
  return fetch(u).then(function (r) {
    if (r.ok || n <= 0 || (r.status !== 403 && r.status !== 429 && r.status < 500)) return r;
    return new Promise(function (ok) { setTimeout(ok, 900 * (5 - n)); }).then(function () { return getRetry(u, n - 1); });
  }, function (e) {
    if (n <= 0) throw e;
    return new Promise(function (ok) { setTimeout(ok, 900 * (5 - n)); }).then(function () { return getRetry(u, n - 1); });
  });
}
function libGet(u) {
  return getRetry(u, 2).then(function (r) {
    if (r.ok || u.indexOf(LIB + "/") !== 0) return r;
    return getRetry(LIB2 + u.slice(LIB.length), 3);
  }, function (e) {
    if (u.indexOf(LIB + "/") !== 0) throw e;
    return getRetry(LIB2 + u.slice(LIB.length), 3);
  });
}
function warmStatic(html, url) {
  var base = baseFor(url, html), list = [], re = /<(?:script|link)\b[^>]*?\s(?:src|href)\s*=\s*["']?([^"'\s>]+)/gi, m;
  while ((m = re.exec(html)) && list.length < 40) {
    try {
      var u = new URL(m[1], base).href;
      if (u.indexOf(CDN + "/gh/") === 0 && !/\.(png|ico|jpe?g|gif|webp|svg)(\?|$)/i.test(u)) list.push(u);
    } catch (e) {}
  }
  return Promise.all(list.map(function (u) { return getRetry(u, 4).then(function (r) { return r.arrayBuffer(); }).catch(function () {}); }));
}
function getHtml(z) {
  var url = zoneURL(z.url);
  return libGet(url).then(function (r) {
    if (!r.ok) throw new Error(r.status + " " + url);
    return r.text();
  }).then(function (h) {
    h = withBase(h, url);
    return warmStatic(h, url).then(function () { return h; });
  });
}
function card(z) {
  var d = document.createElement("div");
  d.className = "card";
  var img = document.createElement("img");
  img.loading = "lazy";
  img.alt = "";
  if (z.cover) img.src = zoneURL(z.cover);
  var s = document.createElement("span");
  s.textContent = z.name;
  d.appendChild(img);
  d.appendChild(s);
  if (z.special && z.special.length) { var t = document.createElement("i"); t.textContent = z.special[0]; d.appendChild(t); }
  var f = document.createElement("b");
  var favs = store("zfav") || [];
  f.className = "fav" + (favs.indexOf(z.id) >= 0 ? " on" : "");
  f.textContent = "★";
  f.onclick = function (e) {
    e.stopPropagation();
    var fv = store("zfav") || [];
    var i = fv.indexOf(z.id);
    if (i >= 0) fv.splice(i, 1); else fv.push(z.id);
    store("zfav", fv);
    f.classList.toggle("on", i < 0);
  };
  d.appendChild(f);
  d.onclick = function () { openZone(z); };
  return d;
}
function render() {
  var q = $("q").value.trim().toLowerCase();
  var fl = $("filter").value, so = $("sort").value;
  var favs = store("zfav") || [];
  var list = zones.filter(function (z) {
    if (fl === "fav" && favs.indexOf(z.id) < 0) return false;
    if ((fl === "unity" || fl === "proxy" || fl === "threads") && !(z.special && z.special.indexOf(fl) >= 0)) return false;
    if (!q) return true;
    if (z.name.toLowerCase().indexOf(q) >= 0) return true;
    return (z.altNames || []).some(function (a) { return String(a).toLowerCase().indexOf(q) >= 0; });
  });
  list.sort(so === "name" ? function (a, b) { return a.name.localeCompare(b.name); } : so === "id" ? function (a, b) { return b.id - a.id; } : function (a, b) { return a.id - b.id; });
  var g = $("grid");
  g.textContent = "";
  var frag = document.createDocumentFragment();
  list.forEach(function (z) { frag.appendChild(card(z)); });
  g.appendChild(frag);
  $("count").textContent = list.length + " / " + zones.length;
  var rec = (store("zrecent") || []).map(function (id) { return zones.find(function (z) { return z.id === id; }); }).filter(Boolean);
  $("recentWrap").hidden = !rec.length || !!q || fl !== "all";
  $("allSec").hidden = $("recentWrap").hidden;
  var r = $("recent");
  r.textContent = "";
  rec.slice(0, 8).forEach(function (z) { r.appendChild(card(z)); });
}
function writeInto(doc, html) { doc.open(); doc.write(html); doc.close(); }
function gameFrame() {
  var f = document.createElement("iframe");
  f.allow = "autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; pointer-lock";
  f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-downloads allow-presentation allow-orientation-lock");
  f.setAttribute("allowfullscreen", "");
  return f;
}
function openZone(z) {
  if (/^https?:/i.test(z.url)) { window.open(z.url, "_blank"); return; }
  cur = z;
  var rec = (store("zrecent") || []).filter(function (id) { return id !== z.id; });
  rec.unshift(z.id);
  store("zrecent", rec.slice(0, 16));
  $("vname").textContent = z.name;
  var box = $("vbox");
  box.textContent = "loading...";
  var f = gameFrame();
  box.appendChild(f);
  $("viewer").classList.add("open");
  document.body.style.overflow = "hidden";
  if (z.special && z.special.indexOf("threads") >= 0 && !self.crossOriginIsolated) {
    var n = document.createElement("div");
    n.id = "note";
    n.innerHTML = "<div>this game uses threads (SharedArrayBuffer), which browsers only allow on cross-origin isolated pages. it can't run from a plain file or s3 page. host this launcher next to <b>coi-serviceworker.js</b> (any https static host) or with COOP/COEP headers to play it.<br><button>try anyway</button></div>";
    n.querySelector("button").onclick = function () { n.remove(); };
    box.appendChild(n);
  }
  try { var u = new URL(location.href); u.searchParams.set("id", z.id); history.pushState(null, "", u.href); } catch (e) {}
  getHtml(z).then(function (html) {
    if (cur !== z) return;
    writeInto(f.contentDocument, html);
    try { f.contentWindow.focus(); } catch (e) {}
  }).catch(function (e) { box.textContent = "failed to load: " + e.message; });
}
function closeZone() {
  cur = null;
  $("vbox").textContent = "";
  $("viewer").classList.remove("open");
  document.body.style.overflow = "";
  try { var u = new URL(location.href); u.searchParams.delete("id"); history.pushState(null, "", u.href); } catch (e) {}
}
$("vclose").onclick = closeZone;
$("vreload").onclick = function () { if (cur) openZone(cur); };
$("vfull").onclick = function () { var f = $("vbox").querySelector("iframe"); if (f && f.requestFullscreen) f.requestFullscreen(); };
$("vblank").onclick = function () {
  if (!cur) return;
  var w = window.open("about:blank", "_blank");
  if (!w) return alert("popup blocked");
  getHtml(cur).then(function (h) { writeInto(w.document, h); });
};
$("vdl").onclick = function () {
  if (!cur) return;
  var z = cur;
  getHtml(z).then(function (h) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([h], { type: "text/html" }));
    a.download = z.name + ".html";
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
};
$("q").oninput = render;
$("filter").onchange = render;
$("sort").onchange = function () { store("zsort", $("sort").value); render(); };
if (location.hash.indexOf("embed") < 0) {
  window.addEventListener("popstate", function () { if (!new URLSearchParams(location.search).get("id")) closeZone(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && cur && !document.fullscreenElement) closeZone(); });
}
try {
  if (!self.crossOriginIsolated && "serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !sessionStorage.getItem("coiTried")) {
    sessionStorage.setItem("coiTried", "1");
    fetch("coi-serviceworker.js", { method: "HEAD" }).then(function (r) {
      if (!r.ok) return;
      navigator.serviceWorker.register("coi-serviceworker.js").then(function () { location.reload(); });
    }).catch(function () {});
  }
} catch (e) {}
var savedSort = store("zsort");
if (savedSort) $("sort").value = savedSort;
libGet(zonesURL).then(function (r) { return r.json(); }).then(function (j) {
  zones = j;
  $("msg").remove();
  var id = new URLSearchParams(location.search).get("id");
  var z = id != null && zones.find(function (x) { return String(x.id) === String(id); });
  if (z && location.hash.indexOf("embed") >= 0 && !/^https?:/i.test(z.url)) {
    // the game gets a fresh about:blank frame like in the grid view: its own globals, and no launcher url in location
    getHtml(z).then(function (h) {
      document.title = z.name;
      document.body.textContent = "";
      document.body.style.cssText = "margin:0;height:100vh;overflow:hidden;background:#000";
      var f = gameFrame();
      f.style.cssText = "border:0;width:100%;height:100%;display:block";
      document.body.appendChild(f);
      writeInto(f.contentDocument, h);
      f.focus();
    });
    return;
  }
  render();
  if (z) openZone(z);
}).catch(function (e) { $("msg").textContent = "failed to load zones: " + e.message; });
})();
</script>
</body>
</html>
