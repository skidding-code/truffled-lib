<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madness Gemini</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #game {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
    }

    #status {
      color: #aaa;
      font: 14px system-ui, sans-serif;
    }

    ruffle-player {
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      scale: "showAll"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>

</head>
<body>
  <main id="game">
    <div id="status">loading...</div>
  </main>
  <script>
    const game = document.getElementById("game");
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    game.replaceChildren(player);
    player.load("https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c1112/_ext/raw.githubusercontent.com/Stinkalistic/UGS/main/SWFs/madnessgemini.swf").catch(() => {
      game.innerHTML = '<div id="status">game could not be loaded</div>';
    });
  </script>
</body>
</html>
