<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROUNDS</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02041b} html,body{height:100dvh}
    #unity-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#02041b;outline:0;touch-action:none}
    #note{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8b8fa3;font:13px Arial,sans-serif;pointer-events:none}
    #note:empty{display:none}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="note"></div>
  <script>
  (() => {
    const Native = window.WebSocket;
    const photon = /(^|\.)(photonengine\.(io|com)|exitgames\.com)$/i;
    function Relayed(url, protocols) {
      try {
        const target = new URL(url, location.href);
        if (photon.test(target.hostname))
          url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/rr?u=' + encodeURIComponent(target.href);
      } catch {}
      return protocols === undefined ? new Native(url) : new Native(url, protocols);
    }
    Relayed.prototype = Native.prototype;
    Object.assign(Relayed, { CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3 });
    window.WebSocket = Relayed;
  })();
  </script>
  <script>
  (() => {
    const buildUrl = 'Build';
    const canvas = document.getElementById('unity-canvas');
    const note = document.getElementById('note');
    const blobUrls = [];
    async function mergedBlob(baseName, suffixes, mimeType) {
      const blobs = await Promise.all(suffixes.map(async suffix => {
        const response = await fetch(`${buildUrl}/${baseName}.part-${suffix}`);
        if (!response.ok) throw new Error(`couldn't load ${baseName}.part-${suffix} (${response.status})`);
        return response.blob();
      }));
      const url = URL.createObjectURL(new Blob(blobs, { type: mimeType }));
      blobUrls.push(url);
      return url;
    }
    const loader = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `${buildUrl}/WebBuild.loader.js`;
      script.onload = resolve;
      script.onerror = () => reject(new Error("couldn't load the game loader"));
      document.body.appendChild(script);
    });
    async function startGame() {
      try {
        const [dataUrl, codeUrl] = await Promise.all([
          mergedBlob('WebBuild.data', ['aa', 'ab', 'ac', 'ad', 'ae', 'af'], 'application/octet-stream'),
          mergedBlob('WebBuild.wasm', ['aa', 'ab', 'ac', 'ad', 'ae'], 'application/wasm'),
          loader
        ]);
        await createUnityInstance(canvas, {
          dataUrl,
          codeUrl,
          frameworkUrl: `${buildUrl}/WebBuild.framework.js`,
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'Landfall Games',
          productName: 'ROUNDS',
          productVersion: '1.1.2',
          showBanner: (message, type) => { if (type === 'error') note.textContent = message; }
        });
      } catch (err) {
        console.error(err);
        note.textContent = (err && err.message ? err.message : "couldn't load the game") + ', refresh to try again';
        blobUrls.splice(0).forEach(url => URL.revokeObjectURL(url));
      }
    }
    window.addEventListener('pagehide', () => blobUrls.forEach(url => URL.revokeObjectURL(url)));
    startGame();
  })();
  </script>
</body>
</html>
