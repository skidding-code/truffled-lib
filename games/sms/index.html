<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario Sunshine</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
#stage {
  position: fixed; inset: 0; display: flex; justify-content: center; align-items: stretch;
  width: 100vw; height: 100vh; height: 100dvh; background: #000;
}
canvas {
  display: block; width: 100% !important; height: 100% !important;
  min-width: 0; min-height: 0; outline: none; image-rendering: auto;
}
#hud {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  background: #000; color: #aaa;
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 24px; z-index: 100; text-align: center;
  transition: opacity 0.3s;
}
#hud.gone { opacity: 0; pointer-events: none; }
#status { max-width: 440px; }
#hud .bad { color: #ff9292; }
#hud progress {
  appearance: none; display: block; width: 200px; max-width: 70vw;
  height: 3px; border: 0; border-radius: 2px; overflow: hidden;
  background: #242424; accent-color: #ddd;
}
#hud progress::-webkit-progress-bar { background: #242424; }
#hud progress::-webkit-progress-value { background: #ddd; }
#hud progress::-moz-progress-bar { background: #ddd; }
#retry { margin-top: 4px; padding: 7px 18px; border: 1px solid #444; border-radius: 5px; background: #191919; color: #eee; font: inherit; cursor: pointer; }
#retry:hover { background: #292929; }
#retry:focus-visible { outline: 2px solid #ddd; outline-offset: 3px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { #hud { transition: none; } }
body.idle { cursor: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" width="640" height="480" tabindex="0"></canvas></div>
<div id="hud" data-noscramble>
  <span id="status" role="status" aria-live="polite">Loading…</span>
  <progress id="progress" max="1" aria-labelledby="status"></progress>
  <button id="retry" type="button" hidden>Try again</button>
</div>
<script>
window.smsIsolation = (async () => {
  const key = 'sms-isolation-reload';
  if (self.crossOriginIsolated) {
    try { sessionStorage.removeItem(key); } catch (e) { /* storage is optional */ }
    return;
  }
  if (!window.isSecureContext || !('serviceWorker' in navigator)) return;
  let timer;
  try {
    // Only suppress an immediate reload loop, not every future visit.
    const lastReload = Number(sessionStorage.getItem(key));
    if (lastReload && Date.now() - lastReload < 30000) return;
    await Promise.race([
      (async () => {
        const registration = await navigator.serviceWorker.register('isolation-sw.js');
        const worker = registration.installing || registration.waiting || registration.active;
        if (!worker) throw new Error('Isolation worker unavailable');
        if (worker.state !== 'activated') {
          await new Promise((resolve, reject) => worker.addEventListener('statechange', () => {
            if (worker.state === 'activated') resolve();
            if (worker.state === 'redundant') reject(new Error('Isolation worker failed'));
          }));
        }
      })(),
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('Isolation setup timed out')), 10000); }),
    ]);
    sessionStorage.setItem(key, String(Date.now()));
  } catch (e) { return; }
  finally { clearTimeout(timer); }
  location.reload();
  await new Promise(() => {});
})();
</script>
<script src="https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c1564/games/sms/zip.js"></script>
<script src="app.js"></script>
</body>
</html>
