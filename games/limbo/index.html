<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIMBO</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #000; color: #aaa; overflow: hidden; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; font: 14px/1.4 system-ui, sans-serif; }
      /* The loading bar (limbo-loader.js) stands in for it. */
      #status { display: none; }
      #stage { position: relative; }
      /* Scaled to fit, 16:9; the compositor maps input through the CSS size.
         Not once the game's frame is the canvas (direct present): the
         compositor fits it to the whole viewport, letterboxed and centred,
         and this size would leave it narrowed against the left edge. */
      #out { display: block; outline: none; }
      #out:not([style*="position: fixed"]) { width: min(100vw, calc(100vh * 16 / 9)) !important;
             height: min(100vh, calc(100vw * 9 / 16)) !important; }
      #log { display: none; }
      body.failed #log { display: block; position: fixed; left: 0; right: 0; bottom: 0; max-height: 30vh; margin: 0;
             padding: 6px 10px; overflow: auto; font: 11px/1.3 ui-monospace, monospace; color: #c88;
             white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
    <script type="module" crossorigin src="./assets/limbo-B0opYgju.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-HclGiUj8.js">
  </head>
  <body>
    <p id="status" role="status">Loading LIMBO…</p>
    <div id="stage"><canvas id="out" tabindex="0"></canvas></div>
    <pre id="log"></pre>
  </body>
</html>
