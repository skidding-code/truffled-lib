<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Celeste</title>
  </head>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* Unity reads clientWidth/clientHeight and matches the drawing buffer to it,
       so sizing the canvas in CSS is enough to make it fill the viewport. */
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
    }
    #unity-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }
    #unity-loading-fill {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width .15s ease-out;
    }
    #unity-error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 80%;
      color: #fff;
      font: 14px/1.5 system-ui, sans-serif;
      white-space: pre-wrap;
      display: none;
    }
  </style>
  <body style="text-align: center">
    <canvas id="unity-canvas"></canvas>
    <script src="Build/build.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/build.data",
        frameworkUrl: "Build/build.framework.js",
        codeUrl: "Build/build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Celeste",
        productVersion: "0.1",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      });
    </script>
  </body>
</html>
