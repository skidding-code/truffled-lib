<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>Minecraft Console Edition</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #canvas{display:block;width:100vw;height:100vh;padding:0;border:0;outline:0;background:#000;touch-action:none}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
    <script src="loading.js"></script>
<script>
    var gameCanvas=document.getElementById('canvas');
    var getGameContext=gameCanvas.getContext.bind(gameCanvas);
    gameCanvas.getContext=function(type,options){
      if(type==='webgl2'||type==='webgl'||type==='experimental-webgl')
        options=Object.assign({},options,{preserveDrawingBuffer:true});
      return getGameContext(type,options);
    };
    gameCanvas.addEventListener('contextmenu',function(event){event.preventDefault()});
    gameCanvas.addEventListener('pointerdown',function(){gameCanvas.focus()});
    var assetVersion='mvheke2m';
    var Module={
      canvas:gameCanvas,
      locateFile:function(name){return name+'?v='+assetVersion},
      print:function(){console.log.apply(console,arguments)},
      printErr:function(){console.error.apply(console,arguments)},
      setStatus:function(status){if(status)console.info(status);window.updateGameLoadBar(status)},
      onRuntimeInitialized:function(){window.finishGameLoadBar()}
    };
  </script>
  <script async type="text/javascript" src="https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c1172/games/mclce/Minecraft.Client.js?v=mvheke2m"></script>
</body>
</html>
