<!DOCTYPE html>
<html lang="en">
	<head>

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>PlaytimeStarterKit</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// windowkill ships whole (unsplit) files, so no entries here.
// The pass-through shim below then loads index.pck / index.wasm directly.
const SPLIT_FILES = {};

function getSplitMatch(url) {
	for (const [filename, info] of Object.entries(SPLIT_FILES)) {
		if (url.endsWith("/" + filename) || url === filename) {
			return { filename, info, basePath: url.substring(0, url.length - filename.length) };
		}
	}
	return null;
}

async function fetchAndCombineParts(basePath, filename, info, onProgress) {
	const partUrls = [];
	for (let i = 1; i <= info.parts; i++) {
		partUrls.push(basePath + filename + ".part" + i);
	}

	let loaded = 0;
	const buffers = [];

	for (const partUrl of partUrls) {
		const resp = await fetch(partUrl);
		if (!resp.ok) throw new Error("Failed to fetch " + partUrl + ": " + resp.status);
		const buf = await resp.arrayBuffer();
		loaded += buf.byteLength;
		buffers.push(buf);
		if (onProgress) onProgress(loaded, info.totalSize);
	}

	const combined = new Uint8Array(loaded);
	let offset = 0;
	for (const buf of buffers) {
		combined.set(new Uint8Array(buf), offset);
		offset += buf.byteLength;
	}
	return combined.buffer;
}

(function() {
	const _NativeXHR = XMLHttpRequest;
	const _origOpen = _NativeXHR.prototype.open;
	const _origSend = _NativeXHR.prototype.send;

	_NativeXHR.prototype.open = function(method, url) {
		this.__splitMatch = getSplitMatch(url);
		return _origOpen.apply(this, arguments);
	};

	_NativeXHR.prototype.send = function(body) {
		var match = this.__splitMatch;
		if (!match) return _origSend.apply(this, arguments);

		var xhr = this;
		var _readyState = 1;

		Object.defineProperty(xhr, "readyState", {
			get: function() { return _readyState; },
			configurable: true
		});

		_readyState = 2;
		if (typeof xhr.onreadystatechange === "function") xhr.onreadystatechange();

		fetchAndCombineParts(match.basePath, match.filename, match.info, function(loaded, total) {
			_readyState = 3;
			if (typeof xhr.onprogress === "function") {
				xhr.onprogress(new ProgressEvent("progress", { lengthComputable: true, loaded: loaded, total: total }));
			}
			xhr.dispatchEvent(new ProgressEvent("progress", { lengthComputable: true, loaded: loaded, total: total }));
		}).then(function(arrayBuffer) {
			Object.defineProperty(xhr, "status", { get: function() { return 200; }, configurable: true });
			Object.defineProperty(xhr, "statusText", { get: function() { return "OK"; }, configurable: true });
			Object.defineProperty(xhr, "response", { get: function() { return arrayBuffer; }, configurable: true });
			Object.defineProperty(xhr, "responseText", { get: function() { return ""; }, configurable: true });
			Object.defineProperty(xhr, "getAllResponseHeaders", {
				value: function() { return "content-length: " + arrayBuffer.byteLength + "\r\ncontent-type: application/octet-stream\r\n"; },
				configurable: true
			});
			Object.defineProperty(xhr, "getResponseHeader", {
				value: function(name) {
					if (name.toLowerCase() === "content-length") return String(arrayBuffer.byteLength);
					if (name.toLowerCase() === "content-type") return "application/octet-stream";
					return null;
				},
				configurable: true
			});

			_readyState = 4;
			if (typeof xhr.onreadystatechange === "function") xhr.onreadystatechange();
			if (typeof xhr.onload === "function") xhr.onload(new ProgressEvent("load", { lengthComputable: true, loaded: arrayBuffer.byteLength, total: arrayBuffer.byteLength }));
			xhr.dispatchEvent(new ProgressEvent("load", { lengthComputable: true, loaded: arrayBuffer.byteLength, total: arrayBuffer.byteLength }));
			xhr.dispatchEvent(new ProgressEvent("loadend"));
		}).catch(function(err) {
			console.error("Split fetch failed for " + match.filename + ":", err);
			if (typeof xhr.onerror === "function") xhr.onerror(err);
			xhr.dispatchEvent(new ProgressEvent("error"));
			xhr.dispatchEvent(new ProgressEvent("loadend"));
		});
	};
})();

(function() {
	var _origFetch = window.fetch.bind(window);
	// These files were briefly served as 0-byte stubs, so some browsers/service
	// workers have a poisoned cache entry. Force a fresh, cache-busted fetch.
	var BUST_RE = /(^|\/)(index\.wasm|index\.pck)($|\?)/;
	var BUST_TOKEN = "wkfix6";
	window.fetch = function(resource, init) {
		var url = (typeof resource === "string") ? resource : resource.url;
		var match = getSplitMatch(url);
		if (!match) {
			if (typeof resource === "string" && BUST_RE.test(resource) && resource.indexOf("v=" + BUST_TOKEN) === -1) {
				var sep = resource.indexOf("?") === -1 ? "?" : "&";
				return _origFetch(resource + sep + "v=" + BUST_TOKEN, Object.assign({}, init, { cache: "reload" }));
			}
			return _origFetch(resource, init);
		}

		return fetchAndCombineParts(match.basePath, match.filename, match.info).then(function(arrayBuffer) {
			return new Response(arrayBuffer, {
				status: 200,
				statusText: "OK",
				headers: { "Content-Length": String(arrayBuffer.byteLength), "Content-Type": "application/octet-stream" }
			});
		});
	};
})();
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10308784,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
