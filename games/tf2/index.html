<!DOCTYPE html>
<html lang="en">
<head>
<base href="https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c1577/games/tf2/">
<meta charset="utf-8">
  
<title>Team Fortress 2</title>
<link href="assets/tf2-favicon.png" rel="icon" type="image/png">
<style>
html,body{margin:0;height:100%;background:#000;color:#ccc;font:13px sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#load,#namePop{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;z-index:10}
#load img{width:200px}
#bar{width:200px;height:2px;background:#333}
#prog{height:100%;width:0;background:#b25216}
#namePop{z-index:20;background:rgba(0,0,0,.85);gap:8px}
#namePop input,#namePop button{width:180px;padding:6px;font:inherit;border:1px solid #444;background:#111;color:#fff;text-align:center}
#namePop button{background:#b25216;border-color:#b25216;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="load">
  <img src="assets/tf2-logo.png" alt="">
  <div id="bar"><div id="prog"></div></div>
</div>
<form id="namePop" hidden>
  <input id="nameIn" maxlength="31" placeholder="Name" required>
  <button>Play</button>
</form>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
(function () {
  var load = document.getElementById("load");
  var prog = document.getElementById("prog");
  var namePop = document.getElementById("namePop");
  var nameIn = document.getElementById("nameIn");
  var nameCb = null;

  window.CS_RELAY_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/tf2relay/";

  namePop.onsubmit = function (e) {
    e.preventDefault();
    var n = nameIn.value.replace(/["';\\\r\n]/g, "").trim().slice(0, 31);
    if (!n) return;
    try { localStorage.setItem("cs_player_name", n); } catch (err) {}
    namePop.hidden = true;
    if (nameCb) nameCb(n);
  };
  ["keydown", "keypress", "keyup"].forEach(function (type) {
    window.addEventListener(type, function (e) {
      if (e.target === nameIn) e.stopImmediatePropagation();
    }, true);
  });

  window.Module = {
    canvas: document.getElementById("canvas"),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.log(t); },
    csSavedName: function () { try { return localStorage.getItem("cs_player_name"); } catch (e) { return ""; } },
    csAskName: function (cb) { nameCb = cb; namePop.hidden = false; nameIn.focus(); },
    csProgress: function (map, p) {
      if (!load.hidden) prog.style.width = p * 100 + "%";
    },
    setStatus: function (t) {
      if (!t) { load.hidden = true; return; }
      var m = t.match(/\((\d+)\/(\d+)\)/);
      if (m) prog.style.width = m[1] / m[2] * 100 + "%";
    },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? "(" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "");
    }
  };
})();
</script>
<script async src="tf2_launcher.js"></script>
</body>
</html>
