<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Patrick's Parabox</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        border: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121E1E;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #121E1E;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/bogparabox.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/bogparabox.data",
        frameworkUrl: "Build/bogparabox.framework.js",
        codeUrl: "Build/bogparabox.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Patrick Traynor",
        productName: "Patrick's Parabox",
        productVersion: "1.0",
      });
    </script>
  </body>
</html>
