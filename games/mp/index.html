<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">



	<meta
		name="viewport"
		content="width=device-width, user-scalable=no, initial-scale=1.0"
	>

	<title>Machine Party</title>

	<style>
		html,
		body,
		#canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			color: white;
			background-color: black;
			overflow: hidden;
			touch-action: none;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
		}

		#canvas:focus {
			outline: none;
		}

		#status {
			position: absolute;
			inset: 0;

			background: black;

			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;

			z-index: 100;
		}

		#status-splash {
			max-height: 100%;
			max-width: 100%;
			margin: auto;
		}

		#status-splash.show-image--false {
			display: none;
		}

		#status-loading-text {
			color: white;
			font-family: Arial, sans-serif;
			font-size: 24px;
			text-align: center;
			margin-bottom: 20px;
		}

		#status-progress {
			width: 50%;
			max-width: 600px;
		}

		#status-notice {
			display: none;

			background-color: #5b3943;
			border: 1px solid #9b3943;
			border-radius: 0.5rem;

			color: #e0e0e0;

			font-family: Arial, sans-serif;

			margin: 2rem;
			padding: 1rem;

			white-space: pre-wrap;
			text-align: center;
		}
	</style>

	<link
		rel="icon"
		type="image/png"
		href="index.icon.png"
	>

	<link
		rel="apple-touch-icon"
		href="index.apple-touch-icon.png"
	>
</head>

<body>

	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">

		<img
			id="status-splash"
			class="show-image--false"
			src="index.png"
			alt=""
		>

		<div id="status-loading-text">
			Loading Machine Party...
		</div>

		<progress
			id="status-progress"
			value="0"
			max="1"
		></progress>

		<div id="status-notice"></div>

	</div>


	<script src="index.js"></script>

	<script>
		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			emscriptenPoolSize: 8,
			ensureCrossOriginIsolationHeaders: false,
			executable: "index",
			experimentalVK: false,

			fileSizes: {
				"index.pck": 636530976,
				"index.wasm": 36157734
			},

			focusCanvas: true,
			gdextensionLibs: [],
			godotPoolSize: 4
		};

		const GODOT_THREADS_ENABLED = false;

		const WASM_PARTS = [
			"index.wasm.part-000",
			"index.wasm.part-001",
			"index.wasm.part-002"
		];


		const PCK_PARTS = [
			"index.pck.part-000",
			"index.pck.part-001",
			"index.pck.part-002",
			"index.pck.part-003",
			"index.pck.part-004",
			"index.pck.part-005",
			"index.pck.part-006",
			"index.pck.part-007",
			"index.pck.part-008",
			"index.pck.part-009",
			"index.pck.part-010",
			"index.pck.part-011",
			"index.pck.part-012",
			"index.pck.part-013",
			"index.pck.part-014",
			"index.pck.part-015",
			"index.pck.part-016",
			"index.pck.part-017",
			"index.pck.part-018",
			"index.pck.part-019",
			"index.pck.part-020",
			"index.pck.part-021",
			"index.pck.part-022",
			"index.pck.part-023",
			"index.pck.part-024",
			"index.pck.part-025",
			"index.pck.part-026",
			"index.pck.part-027",
			"index.pck.part-028",
			"index.pck.part-029",
			"index.pck.part-030",
			"index.pck.part-031",
			"index.pck.part-032",
			"index.pck.part-033",
			"index.pck.part-034",
			"index.pck.part-035",
			"index.pck.part-036",
			"index.pck.part-037",
			"index.pck.part-038",
			"index.pck.part-039",
			"index.pck.part-040"
		];


		const statusOverlay =
			document.getElementById("status");

		const statusProgress =
			document.getElementById("status-progress");

		const statusNotice =
			document.getElementById("status-notice");

		const loadingText =
			document.getElementById("status-loading-text");


		function setLoadingText(text) {
			loadingText.textContent = text;
		}


		function setProgress(current, total) {

			if (total <= 0) {
				statusProgress.removeAttribute("value");
				statusProgress.removeAttribute("max");
				return;
			}

			statusProgress.max = total;
			statusProgress.value = current;
		}


		function showError(error) {

			console.error(error);

			loadingText.style.display = "none";
			statusProgress.style.display = "none";
			statusNotice.style.display = "block";

			let message;

			if (error instanceof Error) {
				message = error.message;
			} else {
				message = String(error);
			}

			statusNotice.textContent =
				"Failed to load Machine Party:\n\n" +
				message;
		}


		async function downloadSplitFile(
			partNames,
			expectedSize,
			label,
			overallStart,
			overallTotal
		) {

			const output =
				new Uint8Array(expectedSize);

			let writeOffset = 0;


			for (
				let i = 0;
				i < partNames.length;
				i++
			) {

				const partName =
					partNames[i];

				setLoadingText(
					`${label} ${i + 1}/${partNames.length}`
				);

				const response =
					await fetch(
						partName,
						{
							cache: "default"
						}
					);

				if (!response.ok) {

					throw new Error(
						`Could not download ${partName} ` +
						`(${response.status} ${response.statusText})`
					);
				}

				const partBuffer =
					await response.arrayBuffer();

				const partArray =
					new Uint8Array(partBuffer);


				if (
					writeOffset +
					partArray.byteLength >
					output.byteLength
				) {

					throw new Error(
						`${partName} makes ${label} larger than expected.`
					);
				}


				output.set(
					partArray,
					writeOffset
				);

				writeOffset +=
					partArray.byteLength;


				setProgress(
					overallStart + i + 1,
					overallTotal
				);
			}


			if (writeOffset !== expectedSize) {

				throw new Error(
					`${label} size mismatch.\n` +
					`Expected: ${expectedSize} bytes\n` +
					`Downloaded: ${writeOffset} bytes`
				);
			}


			return output.buffer;
		}


		async function startMachineParty() {

			try {

				const missing =
					Engine.getMissingFeatures({
						threads:
							GODOT_THREADS_ENABLED
					});


				if (missing.length !== 0) {

					throw new Error(
						"The following browser features " +
						"required by Godot are missing:\n" +
						missing.join("\n")
					);
				}


				const totalParts =
					WASM_PARTS.length +
					PCK_PARTS.length;


				setProgress(
					0,
					totalParts
				);


				const wasmBuffer =
					await downloadSplitFile(
						WASM_PARTS,
						GODOT_CONFIG.fileSizes["index.wasm"],
						"Downloading engine",
						0,
						totalParts
					);


				setLoadingText(
					"Preparing engine..."
				);


				// The loader appends ".wasm" to whatever base path it is
				// given, so a blob: URL can never resolve. Hand it the
				// normal base path and answer that one request from the
				// buffer we just assembled.
				const engineURL =
					new URL(
						"index.wasm",
						location.href
					).href;

				const realFetch =
					window.fetch.bind(window);

				window.fetch = function (input, init) {

					const requested =
						typeof input === "string"
							? input
							: String(
								(input && input.url) || input
							);

					let resolved;

					try {
						resolved =
							new URL(
								requested,
								location.href
							).href;
					} catch (error) {
						resolved = requested;
					}

					if (resolved !== engineURL) {
						return realFetch(input, init);
					}

					return Promise.resolve(
						new Response(
							wasmBuffer,
							{
								headers: {
									"Content-Type":
										"application/wasm",
									"Content-Length":
										String(
											wasmBuffer.byteLength
										)
								}
							}
						)
					);
				};


				const engine =
					new Engine(
						GODOT_CONFIG
					);


				try {
					await engine.init(
						GODOT_CONFIG.executable
					);
				} finally {
					window.fetch = realFetch;
				}

				const pckBuffer =
					await downloadSplitFile(
						PCK_PARTS,
						GODOT_CONFIG.fileSizes["index.pck"],
						"Downloading game data",
						WASM_PARTS.length,
						totalParts
					);


				setLoadingText(
					"Loading game data..."
				);


				await engine.preloadFile(
					pckBuffer,
					"index.pck"
				);


				setLoadingText(
					"Starting Machine Party..."
				);


				await engine.start({
					args: [
						"--main-pack",
						"index.pck"
					]
				});


				statusOverlay.remove();


			} catch (error) {

				showError(
					error
				);
			}
		}


		startMachineParty();
	</script>

</body>
</html>
