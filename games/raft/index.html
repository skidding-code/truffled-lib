<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Raft</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c1365/games/raft/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c1365/games/raft/TemplateData/style.css">
    <script src="https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c1365/games/raft/TemplateData/UnityProgress.js"></script>  
    <script src="https://cdn.jsdelivr.net/gh/skidding-code/truffled-lib@c1365/games/raft/Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Raft-WEBGL.json", {onProgress: UnityProgress});
    </script>

</head>
  <body>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #gameContainer {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        display: block;
      }
      .webgl-content {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
    </style>
    <div class="webgl-content">
      <div id="gameContainer"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Raft</div>
      </div>
    </div>
  </body>
</html>
