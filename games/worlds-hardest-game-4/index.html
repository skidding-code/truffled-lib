<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <title></title>
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
        #swf {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #swf canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>

</head>
<body>
    <div id="swf"></div>
    <script>
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("swf");
            player.style.width = '100%';
            player.style.height = '100%';
                        container.appendChild(player);
            player.load("whg4.swf");
        });
    </script>
</body>
</html>
