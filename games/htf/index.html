<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | ExportedProject</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* full-page canvas */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-container { position: absolute; inset: 0; width: 100%; height: 100%; }
      #unity-canvas { width: 100% !important; height: 100% !important; display: block; background: #000; }
      #unity-footer { display: none; }
    </style>
  </head>
  
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ExportedProject</div>
      </div>
    </div>
    <script>
  var canvas = document.querySelector("#unity-canvas");

  window.alert = function (message) {
    console.warn("[unity]", message);
  };

  unityShowBanner = function (message, type) {
    console.warn("[unity " + (type || "info") + "]", message);
  };

  var buildUrl = "Build";

  var loaderUrl = buildUrl + "/WebGL.loader.js";

  var config = {
    arguments: [],
    dataUrl: buildUrl + "/WebGL.data",
    frameworkUrl: buildUrl + "/WebGL.framework.js",
    codeUrl: buildUrl + "/WebGL.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "ExportedProject",
    productVersion: "1.0",
    showBanner: unityShowBanner
  };

  config.cacheControl = function () {
    return "no-store";
  };

  config.autoSyncPersistentDataPath = true;

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement("meta");

    meta.name = "viewport";
    meta.content =
      "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

    document.getElementsByTagName("head")[0].appendChild(meta);

    document.querySelector("#unity-container").className = "unity-mobile";
    canvas.className = "unity-mobile";
  }

  document.querySelector("#unity-loading-bar").style.display = "block";

  async function fileExists(url) {
    try {
      var response = await fetch(url, {
        method: "HEAD",
        redirect: "manual",
        cache: "no-store"
      });

      return response.status >= 200 && response.status < 300;
    } catch (e) {
      return false;
    }
  }

  async function getPart(url) {
    var response = await fetch(url, {
      method: "GET",
      redirect: "manual",
      cache: "no-store"
    });

    if (response.status < 200 || response.status >= 300) {
      throw new Error(
        "Failed to load " + url + " (HTTP " + response.status + ")"
      );
    }

    return await response.blob();
  }

  async function combineParts(baseUrl, type) {
    var parts = [];

    for (var i = 0; i < 1000; i++) {
      var partUrl;

      if (type === "data") {
        partUrl = baseUrl + ".part" + (i + 1);
      } else {
        partUrl = baseUrl + "." + String(i).padStart(3, "0");
      }

      if (!(await fileExists(partUrl))) {
        console.log("[unity] no more parts:", partUrl);
        break;
      }

      console.log("[unity] loading:", partUrl);

      var blob = await getPart(partUrl);

      parts.push(blob);

      console.log(
        "[unity] loaded part " +
        (i + 1) +
        " (" +
        Math.round(blob.size / 1024 / 1024 * 100) / 100 +
        " MB)"
      );
    }

    if (parts.length === 0) {
      throw new Error("No split parts found for " + baseUrl);
    }

    var combined = new Blob(parts, {
      type: "application/octet-stream"
    });

    console.log(
      "[unity] combined " +
      baseUrl +
      ": " +
      Math.round(combined.size / 1024 / 1024) +
      " MB"
    );

    return URL.createObjectURL(combined);
  }

  async function resolveData() {
    if (await fileExists(config.dataUrl)) {
      return config.dataUrl;
    }

    return await combineParts(config.dataUrl, "data");
  }

  async function resolveWasm() {
    if (await fileExists(config.codeUrl)) {
      return config.codeUrl;
    }

    return await combineParts(config.codeUrl, "wasm");
  }

  var script = document.createElement("script");

  script.src = loaderUrl;

  script.onload = async function () {
    try {
      console.log("[unity] resolving WebGL.data...");

      config.dataUrl = await resolveData();

      console.log("[unity] resolving WebGL.wasm...");

      config.codeUrl = await resolveWasm();

      console.log("[unity] starting Unity...");

      createUnityInstance(
        canvas,
        config,
        function (progress) {
          document.querySelector(
            "#unity-progress-bar-full"
          ).style.width = 100 * progress + "%";
        }
      )
        .then(function (unityInstance) {
          window.unityInstance = unityInstance;

          document.querySelector(
            "#unity-loading-bar"
          ).style.display = "none";

          var fullscreenButton = document.querySelector(
            "#unity-fullscreen-button"
          );

          if (fullscreenButton) {
            fullscreenButton.onclick = function () {
              unityInstance.SetFullscreen(1);
            };
          }
        })
        .catch(function (error) {
          console.error("[unity] error:", error);
        });
    } catch (error) {
      console.error("[unity] split loading error:", error);
    }
  };

  script.onerror = function () {
    console.error("[unity] failed to load loader:", loaderUrl);
  };

  document.body.appendChild(script);
</script>
  </body>
</html>
